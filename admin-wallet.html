<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn Together — جزدان (بەڕێوەبەر)</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#6d4aff">
<link rel="icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5fb;--card:#fff;--ink:#17142b;--muted:#6e6888;--line:#ebe8f5;--brand:#6d4aff;--soft:#efeaff;--danger:#e11d48;--ok:#16a34a;--gold:#f59e0b}
@media (prefers-color-scheme: dark){:root{--bg:#0f0d1a;--card:#1a1729;--ink:#f3f1ff;--muted:#a49fbe;--line:#2a2541;--brand:#8b72ff;--soft:#262043}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Arabic",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
h1{margin:0 0 4px} h2{margin:6px 0 10px;font-size:1.1rem} .muted{color:var(--muted)}
.tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
.tabs button,.btn{border:0;border-radius:12px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;background:var(--soft);color:var(--brand)}
.tabs button.on{background:var(--brand);color:#fff}
.btn.main{background:var(--brand);color:#fff} .btn.ok{background:var(--ok);color:#fff} .btn.danger{background:var(--danger);color:#fff}
.btn:disabled{opacity:.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums} .stat span{font-size:.8rem;color:var(--muted)}
.stat.money b{color:var(--ok)} .stat.warn b{color:var(--gold)}
label{display:block;font-weight:700;margin:10px 0 4px;font-size:.9rem}
input,select,textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px}
textarea{direction:ltr;text-align:left;font-family:ui-monospace,Consolas,monospace;min-height:220px;letter-spacing:.06em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end} .row > *{flex:1;min-width:140px}
table{width:100%;border-collapse:collapse;font-size:.88rem} th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
th{color:var(--muted);font-weight:700;font-size:.78rem}
.scroll{overflow-x:auto}
.tag{border-radius:999px;padding:1px 9px;font-size:.75rem;font-weight:700;white-space:nowrap}
.tag.new,.tag.pending{background:#fef3c7;color:#92400e} .tag.redeemed,.tag.paid{background:#dcfce7;color:#166534} .tag.void,.tag.rejected{background:#ffe4e6;color:#9f1239}
code{direction:ltr;display:inline-block}
.empty{text-align:center;padding:30px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <h1>💰 بەڕێوەبردنی جزدان</h1>
  <div class="muted">کۆدی شەحن، ڕاکێشانی پارە، ڕێکخستن و نرخی دیارییەکان</div>
  <div class="tabs" id="tabs">
    <button class="on" data-t="stats">📊 کورتە</button>
    <button data-t="make">🎟️ دروستکردنی کۆد</button>
    <button data-t="codes">🗂️ کۆدەکان</button>
    <button data-t="payouts">💵 ڕاکێشانەکان</button>
    <button data-t="settings">⚙️ ڕێکخستن</button>
    <button data-t="prices">🎁 نرخی دیاری</button>
    <button data-t="newgift">🎬 دیاری نوێ (ڤیدیۆ)</button>
    <button data-t="admins">👑 بەڕێوەبەرەکان</button>
  </div>
  <div id="box"><div class="empty">…</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="gift-fx.js"></script> <!-- for the 🎬 new-gift preview -->

<script>
"use strict";
const SUPABASE_URL = "https://vjuqtzhefxpiqsmasfkb.supabase.co";
const SUPABASE_KEY = "sb_publishable_hs16UKvg16dApnabYQM9Cw_l2S-_XAU";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const n = (x) => Number(x || 0).toLocaleString("en");
const usd = (x) => "$" + Number(x || 0).toFixed(2);
const day = (s) => s ? new Date(s).toLocaleString("en-GB", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "—";
const METHODS = { fib: "FIB", zaincash: "Zain Cash", fastpay: "FastPay" };
const ST = { new: "نوێ", redeemed: "بەکارهاتوو", void: "هەڵوەشاوە", pending: "چاوەڕوان", paid: "دراوە", rejected: "ڕەتکراوە" };
let tab = "stats", settings = null;

$("#tabs").addEventListener("click", (e) => {
  const b = e.target.closest("[data-t]"); if (!b) return;
  tab = b.dataset.t; document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("on", x === b)); load();
});

async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $("#box").innerHTML = `<div class="card">سەرەتا ئەپەکە لەم وێبگەڕەدا بکەرەوە و بچۆ ژوورەوە.</div>`; return; }
  const { data: ok } = await sb.rpc("is_admin");
  if (!ok) { $("#box").innerHTML = `<div class="card">⛔ تۆ بەڕێوەبەر نیت.</div>`; return; }
  const s = await sb.from("wallet_settings").select("*").eq("id", 1).maybeSingle();
  settings = s.data;
  load();
}
async function names(ids) {
  const list = [...new Set(ids.filter(Boolean))];
  if (!list.length) return {};
  const { data } = await sb.from("profiles").select("id,name").in("id", list);
  return Object.fromEntries((data || []).map((p) => [p.id, p.name]));
}
const priceOf = (coins) => coins / 1000 * Number(settings?.usd_per_1000 || 0.99);

async function load() {
  const box = $("#box"); box.innerHTML = `<div class="empty">…</div>`;
  try { await ({ stats, make, codes, payouts, settingsTab, prices, newgift, admins })[tab === "settings" ? "settingsTab" : tab](box); }
  catch (err) { box.innerHTML = `<div class="card">⚠️ ${esc(err.message || err)}</div>`; }
}

/* 📊 overview */
async function stats(box) {
  const { data, error } = await sb.rpc("admin_wallet_stats"); if (error) throw error;
  const s = data[0];
  const giftUsd = Number(s.gifts_coins) / 1000 * Number(settings.usd_per_1000);
  const keepUsd = (Number(s.gifts_coins) - Number(s.diamonds_given)) / 1000 * Number(settings.usd_per_1000);
  box.innerHTML = `
    <h2>💵 پارە</h2>
    <div class="grid">
      <div class="stat money"><b>${usd(s.usd_sold)}</b><span>فرۆشراو (${n(s.codes_redeemed)} کۆدی بەکارهاتوو · ${n(s.coins_sold)} 🪙)</span></div>
      <div class="stat money"><b>${usd(keepUsd)}</b><span>بەشی تۆ لە دیارییەکان (${Math.round((1 - settings.gift_share) * 100)}٪)</span></div>
      <div class="stat warn"><b>${usd(s.pending_usd)}</b><span>ڕاکێشانی چاوەڕوان (${n(s.pending_count)})</span></div>
      <div class="stat"><b>${usd(s.paid_usd)}</b><span>پارەی دراو بۆ بەکارهێنەران</span></div>
    </div>
    <h2 style="margin-top:18px">🎁 دیاری و کۆد</h2>
    <div class="grid">
      <div class="stat"><b>${n(s.gifts_count)}</b><span>دیاریی نێردراو (${n(s.gifts_coins)} 🪙 · ${usd(giftUsd)})</span></div>
      <div class="stat"><b>${n(s.diamonds_given)} 💎</b><span>ئەڵماسی دراو بە وەرگران</span></div>
      <div class="stat"><b>${n(s.codes_new)}</b><span>کۆدی نەفرۆشراو (${n(s.codes_new_coins)} 🪙)</span></div>
      <div class="stat"><b>${n(s.coins_in_wallets)} 🪙</b><span>سکە لە جزدانەکان</span></div>
      <div class="stat"><b>${n(s.diamonds_in_wallets)} 💎</b><span>ئەڵماس لە جزدانەکان</span></div>
    </div>`;
}

/* 🎟️ make codes */
async function make(box) {
  box.innerHTML = `<div class="card">
    <h2>🎟️ کۆدی نوێ دروست بکە</h2>
    <div class="row">
      <div><label for="m-count">ژمارەی کۆد</label><input id="m-count" type="number" min="1" max="500" value="10"></div>
      <div><label for="m-coins">سکەی هەر کۆدێک (خۆت بینووسە)</label>
        <input id="m-coins" type="number" min="1" max="10000000" step="1" value="10000" list="m-coins-list">
        <datalist id="m-coins-list"><option value="1000"></option><option value="5000"></option><option value="10000"></option><option value="25000"></option><option value="50000"></option><option value="100000"></option></datalist></div>
      <div><label for="m-batch">ناوی کۆمەڵە (ئارەزوومەندانە)</label><input id="m-batch" placeholder="دوکانی ئەحمەد"></div>
    </div>
    <div class="muted" id="m-calc" style="margin-top:8px"></div>
    <button class="btn main" id="m-go" style="margin-top:12px">دروستکردن</button>
    <div class="muted" style="margin-top:8px">⚠️ کۆدەکان تەنها یەک جار لێرە پیشان دەدرێن. دوای دروستکردن ڕاستەوخۆ کۆپییان بکە یان دایانبەزێنە.</div>
  </div>
  <div class="card">
    <h2>✍️ کۆدی خۆت بنووسە</h2>
    <div class="muted">خۆت کۆدەکە دەنووسیت. دەبێت لانیکەم <b>١٠ پیت یان ژمارە</b> بێت، بۆ ئەوەی کەس نەتوانێت بە مەزەندە بیدۆزێتەوە. بۆ نموونە <code>2026AYAD5577</code>. بۆشایی و «-» حیساب ناکرێن.</div>
    <div class="row" style="margin-top:8px">
      <div><label for="c-code">کۆدەکە</label><input id="c-code" maxlength="60" placeholder="2026AYAD5577" autocomplete="off" style="direction:ltr;text-transform:uppercase"></div>
      <div><label for="c-coins">ژمارەی سکە</label><input id="c-coins" type="number" min="1" max="10000000" step="1" value="10000" list="m-coins-list"></div>
      <div><label for="c-batch">ناوی کۆمەڵە (ئارەزوومەندانە)</label><input id="c-batch" placeholder="دوکانی ئەحمەد"></div>
    </div>
    <div class="muted" id="c-calc" style="margin-top:8px"></div>
    <button class="btn main" id="c-go" style="margin-top:12px">دروستکردنی ئەم کۆدە</button>
    <div id="c-out" style="margin-top:10px"></div>
  </div>
  <div id="m-out"></div>`;
  const cNorm = () => $("#c-code").value.toUpperCase().replace(/[^A-Z0-9]/g, "");
  const ccalc = () => {
    const coins = Math.floor(Number($("#c-coins").value)) || 0, len = cNorm().length;
    $("#c-calc").textContent = `${n(coins)} 🪙 = ${usd(priceOf(coins))} · درێژی کۆد: ${len} ${len < 10 ? "(کەمە، لانیکەم ١٠)" : "✅"}`;
  };
  $("#c-code").addEventListener("input", ccalc); $("#c-coins").addEventListener("input", ccalc); ccalc();
  $("#c-go").addEventListener("click", async (e) => {
    const code = cNorm(), coins = Math.floor(Number($("#c-coins").value)), batch = $("#c-batch").value.trim();
    if (code.length < 10) return alert("کۆدەکە دەبێت لانیکەم ١٠ پیت یان ژمارە بێت.");
    if (code.length > 40) return alert("کۆدەکە زۆر درێژە (زۆرترین ٤٠).");
    if (!(coins >= 1 && coins <= 10000000)) return alert("ژمارەی سکە دەبێت لە نێوان ١ و ١٠,٠٠٠,٠٠٠ بێت.");
    e.target.disabled = true;
    const { data, error } = await sb.rpc("admin_create_code", { p_code: code, p_coins: coins, p_batch: batch || null });
    e.target.disabled = false;
    if (error) return alert(/admin_create_code|function/i.test(error.message) ? "سەرەتا SQL ـی update-25-custom-codes Run بکە." : error.message);
    const r = (data || [])[0] || {};
    const msg = { exists: "ئەم کۆدە پێشتر هەیە. کۆدێکی تر بنووسە.", too_short: "کۆدەکە کورتە (لانیکەم ١٠).", too_long: "کۆدەکە زۆر درێژە.", bad_coins: "ژمارەی سکە هەڵەیە." }[r.o_status];
    if (r.o_status !== "ok") return alert(msg || ("هەڵە: " + (r.o_status || "?")));
    $("#c-out").innerHTML = `<div class="stat money"><b style="direction:ltr;font-family:monospace">${esc(r.o_code)}</b><span>✅ دروست کرا · ${n(coins)} 🪙 = ${usd(priceOf(coins))}</span></div>`;
    $("#c-code").value = ""; ccalc();
  });
  const calc = () => {
    const c = Math.max(0, Number($("#m-count").value) || 0), coins = Number($("#m-coins").value);
    $("#m-calc").textContent = `هەر کۆدێک: ${n(coins)} 🪙 = ${usd(priceOf(coins))} · کۆی گشتی: ${n(c * coins)} 🪙 = ${usd(priceOf(c * coins))}`;
  };
  $("#m-count").addEventListener("input", calc); $("#m-coins").addEventListener("input", calc); calc();
  $("#m-go").addEventListener("click", async (e) => {
    const count = Number($("#m-count").value), coins = Math.floor(Number($("#m-coins").value)), batch = $("#m-batch").value.trim();
    if (!(count >= 1 && count <= 500)) return alert("ژمارەکە دەبێت لە نێوان ١ و ٥٠٠ بێت.");
    if (!(coins >= 1 && coins <= 10000000)) return alert("ژمارەی سکە دەبێت لە نێوان ١ و ١٠,٠٠٠,٠٠٠ بێت.");
    e.target.disabled = true;
    const { data, error } = await sb.rpc("admin_generate_codes", { p_count: count, p_coins: coins, p_batch: batch || null });
    e.target.disabled = false;
    if (error) return alert(error.message);
    const codes = (data || []).map((r) => r.code);
    const text = codes.map((c) => `${c}   ${n(coins)} coins`).join("\n");
    $("#m-out").innerHTML = `<div class="card"><h2>✅ ${n(codes.length)} کۆد دروست کرا (${n(coins)} 🪙 = ${usd(priceOf(coins))} بۆ هەر یەکێک)</h2>
      <textarea id="m-text" readonly>${esc(text)}</textarea>
      <div class="row" style="margin-top:10px"><button class="btn main" id="m-copy">📋 کۆپیکردنی هەموو</button><button class="btn" id="m-dl">⬇️ دابەزاندن (.txt)</button></div></div>`;
    $("#m-copy").addEventListener("click", async () => { try { await navigator.clipboard.writeText(text); alert("کۆپی کرا ✅"); } catch { $("#m-text").select(); } });
    $("#m-dl").addEventListener("click", () => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([text + "\n"], { type: "text/plain" }));
      a.download = `talk-together-codes-${coins}-${new Date().toISOString().slice(0, 10)}.txt`; a.click();
    });
  });
}

/* 👑 admins: every admin has the same powers; only the owner adds or removes admins */
async function admins(box) {
  const [list, own] = await Promise.all([sb.rpc("admin_list_admins"), sb.rpc("is_owner")]);
  if (list.error) { box.innerHTML = `<div class="card">${/admin_list_admins|function/i.test(list.error.message) ? "سەرەتا SQL ـی update-29-more-admins Run بکە." : esc(list.error.message)}</div>`; return; }
  const isOwner = own.data === true;
  const me = (await sb.auth.getUser()).data.user?.id;
  box.innerHTML = `<div class="card">
    <h2>👑 بەڕێوەبەرەکان</h2>
    <div class="muted">هەموو بەڕێوەبەرێک هەمان دەسەڵاتی هەیە: پارە، کۆد، ڕاکێشان، نرخ، دیاری، ڕاپۆرت و بلۆک. ${isOwner ? "تەنها تۆ (خاوەن) دەتوانیت بەڕێوەبەر زیاد بکەیت یان لاببەیت." : "تەنها خاوەنی ئەپەکە دەتوانێت بەڕێوەبەر زیاد بکات یان لاببات."}</div>
    <div class="scroll" style="margin-top:10px"><table><tr><th>ناو</th><th>ID</th><th>لە</th><th></th></tr>
    ${(list.data || []).map((a) => `<tr><td>${a.is_owner ? "👑 " : "🛡️ "}${esc(a.name || "—")}${a.user_id === me ? " <span class='muted'>(تۆ)</span>" : ""}</td>
      <td><code style="font-size:.72rem">${esc(a.user_id)}</code></td><td class="num">${day(a.added_at)}</td>
      <td>${isOwner && !a.is_owner ? `<button class="btn danger" data-rm="${esc(a.user_id)}" data-nm="${esc(a.name || "")}">لابردن</button>` : a.is_owner ? "<span class='muted'>خاوەن</span>" : ""}</td></tr>`).join("")}
    </table></div>
  </div>
  ${isOwner ? `<div class="card">
    <h2>➕ بەڕێوەبەری نوێ</h2>
    <div class="muted">ئەو کەسە لە ئەپەکەدا بڕوات بۆ <b>💰 جزدان</b> و دوگمەی <b>📋 کۆپیکردنی ID</b> دابگرێت و ID ـەکەی بۆ تۆ بنێرێت. پاشان لێرە دایبنێ.</div>
    <label for="ad-id">ID ـی ئەو کەسە</label><input id="ad-id" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" style="direction:ltr" autocomplete="off">
    <div id="ad-who" class="muted" style="margin-top:6px"></div>
    <button class="btn main" id="ad-go" style="margin-top:10px">👑 بیکە بە بەڕێوەبەر</button>
    <div class="muted" style="margin-top:8px">⚠️ تەنها کەسێک زیاد بکە کە زۆر متمانەت پێیەتی، چونکە دەتوانێت دەست لە پارە و کۆدەکان بدات.</div>
  </div>` : ""}`;
  const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  $("#ad-id")?.addEventListener("input", async () => {
    const id = $("#ad-id").value.trim(); $("#ad-who").textContent = "";
    if (!UUID.test(id)) return;
    const { data } = await sb.from("profiles").select("name").eq("id", id).maybeSingle();
    $("#ad-who").textContent = data ? `👤 ${data.name}` : "⚠️ ئەم ID ـیە نەدۆزرایەوە.";
  });
  $("#ad-go")?.addEventListener("click", async (e) => {
    const id = $("#ad-id").value.trim();
    if (!UUID.test(id)) return alert("ID ـەکە هەڵەیە. دەبێت وەک ئەمە بێت: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx");
    const who = $("#ad-who").textContent.replace("👤 ", "");
    if (!confirm(`دڵنیایت دەتەوێت «${who || id}» بکەیت بە بەڕێوەبەر؟ هەمان دەسەڵاتی تۆی دەبێت.`)) return;
    e.target.disabled = true;
    const { data, error } = await sb.rpc("admin_add", { p_user: id });
    e.target.disabled = false;
    if (error) return alert(error.message);
    if (data !== "ok") return alert({ not_owner: "تەنها خاوەن دەتوانێت ئەمە بکات.", no_user: "ئەم ID ـیە نەدۆزرایەوە." }[data] || data);
    admins(box);
  });
  box.querySelectorAll("[data-rm]").forEach((b) => b.addEventListener("click", async () => {
    if (!confirm(`«${b.dataset.nm || b.dataset.rm}» لە بەڕێوەبەری لاببەیت؟`)) return;
    const { data, error } = await sb.rpc("admin_remove", { p_user: b.dataset.rm });
    if (error) return alert(error.message);
    if (data !== "ok") return alert({ not_owner: "تەنها خاوەن دەتوانێت ئەمە بکات.", is_owner: "خاوەن لاناچێت." }[data] || data);
    admins(box);
  }));
}

/* 🎬 add a gift from a green-screen video (preview it first, then save) */
const TIER_NAMES = { small: "💝 بچووک", animals: "🦁 ئاژەڵ", special: "✨ تایبەت" };
const videoOpts = (size, keying) => ({ height: `min(${size}vh, ${Math.round(size * 1.15)}vw)`, bottom: "4vh", focusX: 0.5, maxMs: 20000, fadeMs: 600,

const IMG_PREFIX = SUPABASE_URL + "/storage/v1/object/public/gift-images/";
const picHtml = (g) => g.image_url && String(g.image_url).startsWith(IMG_PREFIX)
  ? `<img src="${esc(g.image_url)}" alt="" style="width:46px;height:46px;object-fit:contain">` : `<span style="font-size:1.6rem">${g.emoji}</span>`;
async function uploadPic(id, blob, ext) {
  const path = `${id}-${Date.now()}.${ext}`;
  const up = await sb.storage.from("gift-images").upload(path, blob, { contentType: blob.type || "image/png", upsert: false });
  if (up.error) throw new Error(/bucket|not found/i.test(up.error.message) ? "سەرەتا SQL ـی update-30-gift-pictures Run بکە." : up.error.message);
  return sb.storage.from("gift-images").getPublicUrl(path).data.publicUrl;
}
// takes a frame (at 45% of the clip), removes the green, trims the empty edges and returns a square transparent PNG
async function pictureFromVideo(src) {
  const v = document.createElement("video"); v.muted = true; v.playsInline = true; v.crossOrigin = "anonymous"; v.preload = "auto"; v.src = src;
  await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = () => rej(new Error("ڤیدیۆکە نەکرایەوە")); setTimeout(() => rej(new Error("ڤیدیۆکە زۆری خایاند")), 20000); });
  v.currentTime = Math.max(0.1, v.duration * 0.45); await new Promise((r) => (v.onseeked = r));
  const sc = Math.min(1, 640 / v.videoWidth), w = Math.round(v.videoWidth * sc), h = Math.round(v.videoHeight * sc);
  const c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d", { willReadFrequently: true });
  g.drawImage(v, 0, 0, w, h);
  const d = g.getImageData(0, 0, w, h), p = d.data; let x0 = w, y0 = h, x1 = 0, y1 = 0;
  for (let i = 0; i < p.length; i += 4) {
    const r = p[i] / 255, gr = p[i + 1] / 255, b = p[i + 2] / 255, m = Math.max(r, b), k = gr - m;
    const a = k <= 0.06 ? 1 : k >= 0.16 ? 0 : 1 - (k - 0.06) / 0.1;
    if (gr > m) p[i + 1] = Math.round(m * 255);           // no green tint on the edges
    p[i + 3] = Math.round(a * 255);
    if (a > 0.1) { const px = (i / 4) % w, py = (i / 4 / w) | 0; if (px < x0) x0 = px; if (px > x1) x1 = px; if (py < y0) y0 = py; if (py > y1) y1 = py; }
  }
  g.putImageData(d, 0, 0);
  if (x1 <= x0 || y1 <= y0) throw new Error("لەم ڤیدیۆیەدا هیچ شتێک نەدۆزرایەوە");
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1, S = 256, f = Math.min((S - 12) / bw, (S - 12) / bh);
  const out = document.createElement("canvas"); out.width = S; out.height = S;
  out.getContext("2d").drawImage(c, x0, y0, bw, bh, (S - bw * f) / 2, (S - bh * f) / 2, bw * f, bh * f);
  return await new Promise((r) => out.toBlob(r, "image/png"));
}

  const hasPics = data.length && "image_url" in data[0];
  box.innerHTML = `<div class="card"><h2>🎁 نرخ و وێنەی دیارییەکان (بە سکە)</h2><div class="muted">${usd(Number(settings.usd_per_1000))} = ١,٠٠٠ سکە · لە ئەپەکەدا هەمان ڕیزبەندی دەبینرێت: هەرزانترین لە سەرەوە.</div>
    ${hasPics ? `<div class="muted">🖼️ <b>📷</b> = وێنەیەک بار بکە (PNG بە باکگراوندی ڕوون باشترە) · <b>🎬</b> = وێنەکە لە ڤیدیۆی دیارییەکە دروست دەکرێت و سەوزەکەی لادەبرێت.</div>` : `<div class="muted">بۆ وێنەی دیارییەکان سەرەتا SQL ـی <b>update-30-gift-pictures</b> Run بکە.</div>`}
    <div class="scroll"><table><tr><th>وێنە</th><th>نرخ (🪙)</th><th>بە دۆلار</th><th>چالاک</th><th></th></tr>
    ${data.map((g) => `<tr><td><div style="display:flex;align-items:center;gap:6px"><span data-pic="${esc(g.id)}">${picHtml(g)}</span>
        ${hasPics ? `<label class="btn" style="padding:6px 9px;margin:0" title="وێنە بار بکە">📷<input type="file" accept="image/png,image/jpeg,image/webp,image/gif" data-up="${esc(g.id)}" hidden></label>
        ${(g.video_url || window.GiftFX?.videoOf(g.id)) ? `<button class="btn" style="padding:6px 9px" data-fromvid="${esc(g.id)}" title="لە ڤیدیۆوە">🎬</button>` : ""}
        ${g.image_url ? `<button class="btn" style="padding:6px 9px" data-nopic="${esc(g.id)}" title="لابردنی وێنە">✖</button>` : ""}` : ""}</div></td>
      <td><input type="number" min="1" value="${g.price}" data-price="${esc(g.id)}" style="max-width:130px"></td>
      <td class="num" data-usd="${esc(g.id)}">${usd(priceOf(g.price))}</td><td><input type="checkbox" data-act="${esc(g.id)}" ${g.active ? "checked" : ""} style="width:auto"></td>
      <td><button class="btn" data-save="${esc(g.id)}">💾</button></td></tr>`).join("")}</table></div></div>`;
  box.querySelectorAll("[data-price]").forEach((i) => i.addEventListener("input", () => { box.querySelector(`[data-usd="${i.dataset.price}"]`).textContent = usd(priceOf(Number(i.value))); }));
  box.querySelectorAll("[data-save]").forEach((b) => b.addEventListener("click", async () => {
    const id = b.dataset.save;
    const price = Math.floor(Number(box.querySelector(`[data-price="${id}"]`).value));
    if (!(price >= 1)) return alert("نرخەکە دروست نییە.");
    const { error: e2 } = await sb.from("gift_catalog").update({ price, active: box.querySelector(`[data-act="${id}"]`).checked }).eq("id", id);
    if (e2) return alert(e2.message);
    b.textContent = "✅"; setTimeout(() => (b.textContent = "💾"), 1200);
  }));
  const setPic = async (id, url) => {
    const { error: e3 } = await sb.from("gift_catalog").update({ image_url: url }).eq("id", id);
    if (e3) throw new Error(e3.message);
    const g = data.find((x) => x.id === id); if (g) g.image_url = url;
    box.querySelector(`[data-pic="${id}"]`).innerHTML = picHtml(g || { emoji: "🎁", image_url: url });
  };
  box.querySelectorAll("[data-up]").forEach((inp) => inp.addEventListener("change", async () => {
    const f = inp.files[0]; if (!f) return;
    if (f.size > 2 * 1048576) return alert("وێنەکە زۆر گەورەیە (زۆرترین 2 MB).");
    const holder = box.querySelector(`[data-pic="${inp.dataset.up}"]`); holder.textContent = "⏳";
    try { const ext = (f.name.split(".").pop() || "png").toLowerCase().replace(/[^a-z0-9]/g, "") || "png"; await setPic(inp.dataset.up, await uploadPic(inp.dataset.up, f, ext)); }
    catch (err) { alert(err.message || err); holder.innerHTML = picHtml(data.find((x) => x.id === inp.dataset.up)); }
  }));
  box.querySelectorAll("[data-fromvid]").forEach((b) => b.addEventListener("click", async () => {
    const id = b.dataset.fromvid, g = data.find((x) => x.id === id);
    const src = g?.video_url || window.GiftFX?.videoOf(id); if (!src) return;
    const holder = box.querySelector(`[data-pic="${id}"]`); holder.textContent = "⏳"; b.disabled = true;
    try { await setPic(id, await uploadPic(id, await pictureFromVideo(src), "png")); }
    catch (err) { alert(err.message || err); holder.innerHTML = picHtml(g); }
    b.disabled = false;
  }));
  box.querySelectorAll("[data-nopic]").forEach((b) => b.addEventListener("click", async () => {
    try { await setPic(b.dataset.nopic, null); b.remove(); } catch (err) { alert(err.message || err); }
  }));
}

start();
</script>
</body>
</html>
