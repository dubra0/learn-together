<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talk Together</title>
<meta name="description" content="Live voice rooms for practicing any language">
<meta name="theme-color" content="#6d4aff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5fb; --card:#ffffff; --ink:#17142b; --muted:#6e6888; --line:#ebe8f5;
  --brand:#6d4aff; --brand-2:#3b82f6; --brand-ink:#ffffff; --soft:#efeaff; --soft-2:#e8f0ff;
  --grad:linear-gradient(135deg,#6d4aff 0%,#3b82f6 100%);
  --danger:#ef4444; --ok:#16a34a; --warn:#f59e0b; --live:#ef4444; --speak:#22c55e;
  --radius:20px; --shadow:0 6px 24px rgba(40,20,120,.08); --shadow-lg:0 14px 40px rgba(40,20,120,.18);
  --tabbar:68px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f0d1a; --card:#1a1729; --ink:#f3f1ff; --muted:#a49fbe; --line:#2a2541;
    --brand:#8b72ff; --soft:#262043; --soft-2:#1d2744;
    --shadow:0 6px 24px rgba(0,0,0,.35); --shadow-lg:0 14px 40px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans","Noto Sans Arabic",system-ui,sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
html[dir="rtl"] body{font-family:"Noto Sans Arabic","Noto Sans",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
[hidden]{display:none !important}
.screen{min-height:100vh;min-height:100dvh}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px calc(var(--tabbar) + 96px + env(safe-area-inset-bottom))}
h1{font-size:1.5rem;line-height:1.25;margin:4px 0 6px;font-weight:800;letter-spacing:-.01em}
h2.section{font-size:1.05rem;margin:22px 0 10px;font-weight:700;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)} .small{font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin:12px 0}
label.lbl{display:block;font-weight:600;margin:14px 0 6px;font-size:.92rem}
input,select,textarea{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
textarea{resize:vertical;min-height:84px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;
  font-weight:700;cursor:pointer;background:var(--grad);color:var(--brand-ink);min-height:48px;box-shadow:0 6px 16px rgba(109,74,255,.28);
  transition:transform .08s, opacity .15s}
.btn:active{transform:scale(.97)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:8px 14px;border-radius:12px;font-size:.9rem;box-shadow:none}
.btn.ghost{background:var(--soft);color:var(--brand);box-shadow:none}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.danger{background:var(--danger);box-shadow:none}
.btn.danger-ghost{background:transparent;color:var(--danger);box-shadow:none;border:1.5px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{width:42px;height:42px;border-radius:14px;border:0;background:var(--soft);color:var(--brand);display:inline-grid;place-items:center;cursor:pointer;flex:0 0 42px}
.icon-btn svg{width:22px;height:22px}
.link-btn{background:none;border:0;color:var(--brand);font-weight:600;cursor:pointer;padding:6px}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.08rem;white-space:nowrap}
.brand img{width:34px;height:34px;border-radius:11px;box-shadow:var(--shadow)}
.top-right{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:700;font-size:.85rem}
.appbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
  background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.appbar .title{flex:1;font-weight:800;font-size:1.05rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
html[dir="rtl"] .flip{transform:scaleX(-1)}

/* hero */
.hero{background:var(--grad);color:#fff;border-radius:24px;padding:20px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12);top:-60px;inset-inline-end:-40px}
.hero .hello{font-size:1.35rem;font-weight:800;position:relative}
.hero .sub{opacity:.9;position:relative}
.hero .stats{display:flex;gap:8px;margin-top:14px;position:relative;flex-wrap:wrap}
.hero .stat{background:rgba(255,255,255,.18);border-radius:14px;padding:8px 12px;font-weight:700}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:none;margin:0 -16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.88rem;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg .chip{flex:1;text-align:center}
.seg .chip.on{background:var(--soft);color:var(--brand);border-color:var(--brand)}

/* room cards */
.room-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:10px 0;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.room-card::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:5px;background:var(--grad)}
.room-card h3{margin:0;font-size:1.08rem;font-weight:700;word-break:break-word}
.rc-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{background:var(--soft);color:var(--brand);border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:600}
.tag.blue{background:var(--soft-2);color:var(--brand-2)}
.tag.live{background:rgba(239,68,68,.12);color:var(--live)}
.tag.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--live);display:inline-block;margin-inline-end:6px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.rc-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px}
.host{display:flex;align-items:center;gap:8px;min-width:0;color:var(--muted);font-size:.9rem}
.host span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;padding:28px 12px;color:var(--muted);background:var(--card);border:1.5px dashed var(--line);border-radius:var(--radius)}
.empty .big{font-size:2.2rem;display:block;margin-bottom:6px}

/* avatars */
.av{border-radius:50%;background:var(--soft);color:var(--brand);display:inline-grid;place-items:center;font-weight:800;overflow:hidden;flex:0 0 auto;position:relative}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.xs{width:26px;height:26px;font-size:.75rem}
.av.sm{width:40px;height:40px;font-size:1rem}
.av.md{width:64px;height:64px;font-size:1.4rem}
.av.lg{width:96px;height:96px;font-size:2.2rem}
.ring{padding:3px;border-radius:50%;background:var(--grad);display:inline-block}
.ring .av{border:3px solid var(--card)}

/* people grid (room) */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:16px 10px;margin-top:10px}
.person{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;font-size:.82rem;cursor:pointer;background:none;border:0;padding:0}
.person .face{position:relative;width:68px;height:68px;border-radius:50%;padding:3px;background:transparent;transition:background .2s}
.person .face .av{width:62px;height:62px;font-size:1.4rem}
.person.speaking .face{background:var(--speak);box-shadow:0 0 0 6px rgba(34,197,94,.18);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(34,197,94,.06)}}
.person .badge{position:absolute;bottom:-2px;inset-inline-start:-2px;background:var(--card);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:.8rem;box-shadow:var(--shadow)}
.person .hand{position:absolute;top:-6px;inset-inline-end:-6px;font-size:1.2rem;animation:wave 1s infinite}
@keyframes wave{50%{transform:rotate(14deg)}}
.person .pname{max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.group-title{font-weight:700;margin:20px 0 0;font-size:.9rem;color:var(--muted);display:flex;align-items:center;gap:6px}

/* topic card */
.topic{background:var(--grad);color:#fff;border-radius:var(--radius);padding:16px;margin:12px 0;box-shadow:var(--shadow-lg);animation:pop .3s}
.topic .lbl{opacity:.85;font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
.topic .txt{font-size:1.12rem;font-weight:700;margin-top:4px}
@keyframes pop{from{transform:scale(.96);opacity:0}}

/* chat */
.chat-list{max-height:42vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin:8px 0}
.msg{display:flex;gap:8px;align-items:flex-end}
.msg .bubble{background:var(--soft);border-radius:16px;border-end-start-radius:6px;padding:8px 12px;max-width:80%;word-break:break-word}
.msg .who{font-size:.75rem;font-weight:700;color:var(--brand)}
.msg.mine{flex-direction:row-reverse}
.msg.mine .bubble{background:var(--grad);color:#fff;border-end-start-radius:16px;border-end-end-radius:6px}
.msg.mine .who{color:#fff;opacity:.85}
.msg .acts{display:flex;gap:2px;opacity:.75}
.msg .acts button{border:0;background:none;cursor:pointer;font-size:.9rem;padding:2px 4px}
.chat-form{display:flex;gap:8px}
.chat-form input{flex:1}
.chat-form .btn{min-height:46px}

/* room controls */
.controls{position:fixed;inset-inline:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center}
.controls .btn{flex:1;max-width:220px;padding:12px 8px}

/* tab bar */
.tabbar{position:fixed;inset-inline:0;bottom:0;z-index:30;height:calc(var(--tabbar) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
  background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex}
.tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:.72rem;font-weight:600;cursor:pointer}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--brand)}
.fab{position:fixed;bottom:calc(var(--tabbar) + 16px + env(safe-area-inset-bottom));inset-inline-end:16px;z-index:29;border-radius:18px;box-shadow:var(--shadow-lg)}

/* lists */
.row-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;margin:8px 0;box-shadow:var(--shadow);cursor:pointer}
.row-item .info{flex:1;min-width:0}
.row-item .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-item .meta{color:var(--muted);font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank{width:30px;text-align:center;font-weight:800;color:var(--muted)}
.row-item.me{border-color:var(--brand);background:var(--soft)}
.menu{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin:12px 0}
.menu > *{display:flex;align-items:center;gap:12px;width:100%;padding:15px 16px;border:0;background:none;border-bottom:1px solid var(--line);cursor:pointer;text-align:start;font-weight:600;text-decoration:none;color:var(--ink)}
.menu > *:last-child{border-bottom:0}
.menu .end{margin-inline-start:auto;color:var(--muted);font-weight:500;font-size:.85rem}
.menu select{width:auto;margin-inline-start:auto;padding:6px 10px;border-radius:10px}
.menu .danger{color:var(--danger)}

/* profile */
.profile-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:8px 0}
.profile-head .nm{font-size:1.35rem;font-weight:800}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stats3 > div{background:var(--soft);border-radius:16px;padding:10px;text-align:center}
.stats3 b{display:block;font-size:1.25rem;color:var(--brand)}
.stats3 span{font-size:.75rem;color:var(--muted);font-weight:600}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badge-item{text-align:center;font-size:.7rem;color:var(--muted);font-weight:600}
.badge-item .ic{width:52px;height:52px;border-radius:16px;margin:0 auto 4px;display:grid;place-items:center;font-size:1.6rem;background:var(--soft);filter:grayscale(1);opacity:.45}
.badge-item.got .ic{filter:none;opacity:1;background:linear-gradient(135deg,#ffe8a3,#ffc46b)}
.lang-line{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.learn-row{display:flex;gap:8px;margin:8px 0}
.learn-row select{flex:1}
.learn-row button{flex:0 0 46px}
.avatar-pick{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;margin:6px 0 4px;background:none;border:0;width:100%}
.avatar-pick .av{width:96px;height:96px;font-size:2rem;border:3px dashed var(--line)}
.avatar-pick span{color:var(--brand);font-weight:700}
.check{display:flex;gap:10px;align-items:flex-start;margin:14px 0;font-size:.9rem}
.check input{width:20px;height:20px;flex:0 0 20px;margin-top:2px;accent-color:var(--brand)}

/* onboarding + welcome */
.ob{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;padding:calc(16px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
.ob-top{display:flex;justify-content:space-between;align-items:center}
.ob-top select{width:auto;border-radius:999px;padding:6px 12px}
.ob-slide{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;animation:pop .3s}
.ob-art{width:180px;height:180px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-size:5rem;box-shadow:var(--shadow-lg);margin-bottom:16px}
.ob-slide h1{font-size:1.7rem}
.ob-slide p{color:var(--muted);max-width:360px;margin:0}
.dots{display:flex;gap:6px;justify-content:center;margin:20px 0}
.dots i{width:8px;height:8px;border-radius:99px;background:var(--line);transition:width .2s}
.dots i.on{width:24px;background:var(--brand)}
.welcome-hero{text-align:center;padding:30px 0 10px}
.welcome-hero img{width:84px;height:84px;border-radius:24px;box-shadow:var(--shadow-lg)}
.welcome-hero h1{font-size:1.8rem;margin-top:14px}

/* bottom sheet */
#sheet-backdrop{position:fixed;inset:0;background:rgba(10,8,25,.45);z-index:50;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:51;background:var(--card);border-radius:26px 26px 0 0;max-height:88vh;overflow-y:auto;
  padding:8px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:var(--shadow-lg);animation:up .25s ease-out;max-width:680px;margin:0 auto}
@keyframes up{from{transform:translateY(100%)}}
.sheet-handle{width:44px;height:5px;border-radius:99px;background:var(--line);margin:6px auto 12px}
.sheet .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.sheet .actions .btn{flex:1;min-width:130px}
.reason{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--line);border-radius:14px;margin:8px 0;cursor:pointer}
.reason input{width:18px;height:18px;accent-color:var(--brand)}

/* toast */
#toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translate(-50%,calc(-100% - 60px));background:var(--ink);color:var(--bg);
  padding:12px 16px;border-radius:16px;font-size:.92rem;z-index:80;max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center;
  box-shadow:var(--shadow-lg);transition:transform .25s}
#toast.show{transform:translate(-50%,0)}
#toast button{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:6px 12px;font-weight:700;cursor:pointer}
.notice{background:#fff7e6;color:#7a4b00;border:1px solid #ffd591;border-radius:14px;padding:12px;margin:12px 0}
code{background:var(--soft);padding:1px 6px;border-radius:6px;direction:ltr;display:inline-block}
@media (min-width:700px){ .people{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))} }

/* ================= voice room "stage" ================= */
.stage-screen{--st-bg1:#2b1d72;--st-bg2:#160f3d;--st-card:rgba(255,255,255,.08);--st-card2:rgba(255,255,255,.14);--st-ink:#fff;--st-muted:rgba(255,255,255,.65);
  background:radial-gradient(120% 60% at 50% 0%,#4a35b8 0%,var(--st-bg1) 45%,var(--st-bg2) 100%);color:var(--st-ink);
  display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.stage-head{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 8px}
.s-btn{width:40px;height:40px;border-radius:50%;border:0;background:var(--st-card);color:#fff;display:grid;place-items:center;cursor:pointer;flex:0 0 40px}
.s-btn svg{width:20px;height:20px}
.s-title{flex:1;min-width:0}
.s-title .t{font-weight:800;font-size:1.08rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-sub{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.s-sub .tg{background:var(--st-card2);border-radius:8px;padding:1px 8px;font-size:.72rem;font-weight:700}
.s-sub .tg.lv{background:linear-gradient(135deg,#6d4aff,#3b82f6)}
.s-sub .tg.live{background:#ef4444}
.s-follow{border:0;border-radius:999px;padding:7px 14px;font-weight:800;background:#8b5cf6;color:#fff;cursor:pointer;font-size:.85rem}
.s-follow.on{background:var(--st-card2)}
.stage-body{flex:1;overflow-y:auto;padding:6px 14px 12px;max-width:680px;width:100%;margin:0 auto}
.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;padding:8px 0 4px}
.seat{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;color:#fff;cursor:pointer;padding:0;min-width:0}
.seat .ring2{position:relative;width:70px;height:70px;border-radius:50%;padding:3px;transition:box-shadow .2s}
.seat .ring2 .av{width:64px;height:64px;font-size:1.4rem;background:#5b47c9;color:#fff}
.seat.speaking .ring2{box-shadow:0 0 0 3px #4ade80,0 0 18px 4px rgba(74,222,128,.55);animation:glow 1s infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px #4ade80,0 0 26px 8px rgba(74,222,128,.25)}}
.seat .muted-ic{position:absolute;bottom:0;inset-inline-end:0;width:22px;height:22px;border-radius:50%;background:#ef4444;display:grid;place-items:center;font-size:.65rem;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.seat .flag-b{position:absolute;bottom:0;inset-inline-start:0;font-size:1rem;line-height:1;background:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.seat .host-b{position:absolute;top:-4px;inset-inline-end:-2px;font-size:1rem}
.seat .nm{font-size:.8rem;font-weight:600;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat.empty .ring2{background:var(--st-card);display:grid;place-items:center;width:70px;height:70px}
.seat.empty .ring2 svg{width:28px;height:28px;opacity:.85}
.seat.empty .nm{color:var(--st-muted)}
.aud-head{display:flex;align-items:center;gap:6px;margin:14px 0 6px;color:var(--st-muted);font-size:.85rem;font-weight:700}
.audience{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.audience::-webkit-scrollbar{display:none}
.aud{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;width:54px;background:none;border:0;color:#fff;cursor:pointer;padding:0;position:relative}
.aud .av{width:46px;height:46px;font-size:1rem;background:#5b47c9;color:#fff;border:2px solid rgba(255,255,255,.25)}
.aud .nm{font-size:.7rem;max-width:54px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--st-muted)}
.aud .hand{position:absolute;top:-4px;inset-inline-end:0;font-size:1rem;animation:wave 1s infinite}
.aud .fl{position:absolute;top:30px;inset-inline-start:2px;font-size:.75rem}
.aud.more .av{background:var(--st-card2);font-size:.8rem}
.stage-screen .topic{margin:10px 0;background:linear-gradient(135deg,#7c3aed,#2563eb);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.s-chat{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.smsg{display:flex;gap:8px;align-items:flex-start;max-width:92%}
.smsg .av{width:30px;height:30px;font-size:.75rem;background:#5b47c9;color:#fff;margin-top:2px}
.smsg .bub{background:rgba(0,0,0,.28);border-radius:16px;padding:7px 12px;cursor:pointer;word-break:break-word;font-size:.92rem}
.smsg .who{color:#c4b5fd;font-weight:700;margin-inline-end:6px}
.smsg.host .who{color:#fcd34d}
.smsg.mine .bub{background:rgba(139,92,246,.45)}
.smsg .quote{border-inline-start:3px solid #a78bfa;padding-inline-start:8px;margin-bottom:4px;color:var(--st-muted);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.smsg.sys .bub{background:rgba(255,255,255,.1);color:var(--st-muted);font-size:.82rem;cursor:default}
.s-bottom{padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,rgba(10,6,30,.55) 30%)}
.s-form{display:flex;gap:8px;align-items:center;max-width:680px;margin:0 auto}
.s-form input{flex:1;background:rgba(255,255,255,.12);border:0;border-radius:999px;color:#fff;padding:12px 16px}
.s-form input::placeholder{color:rgba(255,255,255,.55)}
.s-round{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:1.15rem;display:grid;place-items:center;cursor:pointer;flex:0 0 44px}
.s-round svg{width:20px;height:20px}
.s-round.on{background:#22c55e}
.s-round.off{background:rgba(239,68,68,.85)}
.s-round.send{background:linear-gradient(135deg,#8b5cf6,#3b82f6)}
.s-round:disabled{opacity:.45}
.reply-bar{display:flex;align-items:center;gap:8px;max-width:680px;margin:0 auto 6px;background:rgba(255,255,255,.1);border-radius:12px;padding:6px 10px;font-size:.82rem;color:var(--st-muted)}
.reply-bar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reply-bar button{background:none;border:0;color:#fff;cursor:pointer}
/* ================= profile page ================= */
.pf{padding:0;overflow:hidden}
.pf-cover{height:110px;background:var(--grad);position:relative}
.pf-cover::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 80% at 80% 0%,rgba(255,255,255,.25),transparent 60%)}
.pf-main{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:0 16px 16px;margin-top:-52px;position:relative}
.pf-main .ring{box-shadow:var(--shadow-lg)}
.pf-edit-dot{position:absolute;bottom:4px;inset-inline-end:4px;background:var(--brand);color:#fff;border-radius:50%;width:32px;height:32px;display:grid;place-items:center;font-size:.9rem;border:3px solid var(--card)}
.pf-name{font-size:1.4rem;font-weight:800}
.tag-follows{background:var(--soft-2);color:var(--brand-2);border-radius:8px;padding:1px 8px;font-size:.75rem;font-weight:700}
.pf-actions{display:flex;gap:8px;width:100%;margin-top:8px}
.pf-actions .btn{flex:1}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.gallery button{aspect-ratio:1;border:0;padding:0;border-radius:14px;overflow:hidden;cursor:pointer;background:var(--soft)}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.gallery .add{display:grid;place-items:center;font-size:1.8rem;color:var(--brand);border:2px dashed var(--line);background:transparent}
.seg-tabs{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px;margin:6px 0 10px}
.seg-tabs button{flex:1;border:0;background:none;border-radius:10px;padding:8px;font-weight:700;color:var(--muted);cursor:pointer}
.seg-tabs button.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow)}
.new-tag{background:#ef4444;color:#fff;border-radius:6px;padding:0 6px;font-size:.68rem;font-weight:800;margin-inline-start:4px}
.photo-view img{width:100%;border-radius:18px;display:block;max-height:70vh;object-fit:contain;background:#000}

/* ================= posts / feed ================= */
.post{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin:12px 0;overflow:hidden}
.post-h{display:flex;align-items:center;gap:10px;padding:12px 14px 6px;cursor:pointer}
.post-h .info{flex:1;min-width:0}
.post-h .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post-h .tm{font-size:.75rem;color:var(--muted)}
.post-body{padding:4px 14px 10px;white-space:pre-wrap;word-break:break-word;font-size:1rem}
.post-img{width:100%;display:block;max-height:520px;object-fit:cover;background:var(--soft)}
.post-f{display:flex;align-items:center;gap:6px;padding:8px 10px}
.post-f button{border:0;background:none;cursor:pointer;padding:6px 10px;border-radius:12px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.post-f button.on{color:#ef4444}
.post-f button:hover{background:var(--soft)}
.post-f .grow{flex:1}
@keyframes heart{50%{transform:scale(1.35)}}
.post-f button.pop span:first-child{display:inline-block;animation:heart .35s}
.post{position:relative;-webkit-user-select:none;user-select:none}
.big-heart{position:absolute;left:50%;top:50%;font-size:6.5rem;pointer-events:none;z-index:3;transform:translate(-50%,-50%) scale(0);
  filter:drop-shadow(0 6px 18px rgba(239,68,68,.45));animation:bigheart .9s ease-out forwards}
@keyframes bigheart{15%{transform:translate(-50%,-50%) scale(1.25);opacity:1}30%{transform:translate(-50%,-50%) scale(.95)}45%{transform:translate(-50%,-50%) scale(1.05)}75%{opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
.cm{display:flex;gap:8px;margin:10px 0;align-items:flex-start}
.cm-b{flex:1;background:var(--soft);border-radius:16px;border-start-start-radius:6px;padding:8px 12px;word-break:break-word}
.cm-b b{cursor:pointer}
.cm .tm{font-size:.72rem;color:var(--muted);margin-top:2px;display:flex;gap:10px}
.cm .tm button{border:0;background:none;color:var(--muted);cursor:pointer;padding:0;font-size:.72rem}
.cm-form{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));background:var(--card);padding:10px 0 4px;display:flex;gap:8px}
.cm-form input{flex:1;border-radius:999px}
.pf-gear{position:absolute;top:10px;inset-inline-end:10px;z-index:2;width:40px;height:40px;border-radius:50%;border:0;cursor:pointer;
  background:rgba(255,255,255,.25);color:#fff;font-size:1.15rem;display:grid;place-items:center;backdrop-filter:blur(6px)}
/* TikTok-style profile */
.tt-stats{display:flex;justify-content:center;gap:4px;margin:12px 0 4px;width:100%}
.tt-stats > *{flex:1;max-width:110px;background:none;border:0;cursor:pointer;color:var(--ink);padding:4px;border-radius:12px;text-align:center}
.tt-stats b{display:block;font-size:1.2rem;font-weight:800}
.tt-stats span{font-size:.78rem;color:var(--muted);font-weight:600}
.tt-stats .sep{flex:0 0 1px;max-width:1px;background:var(--line);margin:8px 0;padding:0;cursor:default}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:8px}
.ptile{aspect-ratio:3/4;position:relative;border:0;padding:0;cursor:pointer;overflow:hidden;border-radius:6px;background:var(--grad);color:#fff}
.ptile img{width:100%;height:100%;object-fit:cover;display:block}
.ptile .txt{position:absolute;inset:0;padding:10px;font-size:.78rem;font-weight:700;text-align:start;overflow:hidden;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;line-height:1.35}
.ptile .lk{position:absolute;bottom:6px;inset-inline-start:6px;font-size:.75rem;font-weight:800;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.rel{font-size:.72rem;font-weight:700;border-radius:8px;padding:1px 8px;margin-inline-start:4px}
.rel.friend{background:rgba(34,197,94,.15);color:#16a34a}
.rel.fy{background:var(--soft-2);color:var(--brand-2)}

/* ================= private messages ================= */
.badge-dot{position:absolute;top:-4px;inset-inline-end:-4px;min-width:18px;height:18px;border-radius:999px;background:#ef4444;color:#fff;font-size:.68rem;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.lv{display:inline-flex;align-items:center;gap:2px;background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff;border-radius:8px;padding:1px 7px;font-size:.72rem;font-weight:800;vertical-align:middle}
.counts{display:flex;justify-content:center;gap:22px;margin:10px 0 4px}
.counts button{background:none;border:0;cursor:pointer;color:var(--ink);text-align:center;padding:4px 6px;border-radius:12px}
.counts b{display:block;font-size:1.15rem}
.counts span{font-size:.78rem;color:var(--muted);font-weight:600}
.unread{background:#ef4444;color:#fff;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:.75rem;font-weight:800;padding:0 6px}
.dm-screen{display:flex;flex-direction:column;height:100vh;height:100dvh}
.dm-who{flex:1;display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;font-weight:800;font-size:1.02rem;color:var(--ink);min-width:0;text-align:start}
.dm-who span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dm-body{flex:1;overflow-y:auto;padding:10px 14px}
#dm-list{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dmsg{display:flex}
.dmsg .b{max-width:78%;background:var(--card);border:1px solid var(--line);border-radius:18px;border-end-start-radius:6px;padding:8px 12px;word-break:break-word;box-shadow:var(--shadow);cursor:pointer}
.dmsg.mine{justify-content:flex-end}
.dmsg.mine .b{background:var(--grad);color:#fff;border:0;border-end-start-radius:18px;border-end-end-radius:6px}
.dmsg .tm{font-size:.68rem;opacity:.65;margin-top:2px;text-align:end}
.dmsg audio{max-width:230px;height:40px;display:block}
.day-sep{text-align:center;color:var(--muted);font-size:.75rem;margin:8px 0}
.dm-bottom{padding:8px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card)}
.dm-form{display:flex;gap:8px;align-items:center;max-width:680px;margin:0 auto}
.dm-form input{flex:1;border-radius:999px}
.dm-rec,.dm-send{width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;flex:0 0 46px;font-size:1.15rem}
.dm-rec{background:var(--soft);color:var(--brand)}
.dm-rec.rec{background:#ef4444;color:#fff;width:auto;padding:0 14px;border-radius:999px;font-size:.9rem;font-weight:800;animation:blink 1.2s infinite}
.dm-send{background:var(--grad);color:#fff}
.dm-send svg{width:20px;height:20px}
.invite-card{text-align:center;padding:10px 0}
.invite-card .big{font-size:3rem}
</style>
</head>
<body>

<!-- ============ Onboarding ============ -->
<section id="screen-onboarding" class="screen" hidden>
  <div class="ob">
    <div class="ob-top">
      <select id="ob-lang" aria-label="Language"></select>
      <button class="link-btn" id="ob-skip" type="button" data-i18n="skip"></button>
    </div>
    <div id="ob-slide" class="ob-slide"></div>
    <div class="dots" id="ob-dots"></div>
    <button class="btn block" id="ob-next" type="button"></button>
  </div>
</section>

<!-- ============ Setup missing ============ -->
<section id="screen-setup" class="screen" hidden>
  <div class="wrap"><h1>⚙️ Setup not finished</h1>
    <div class="notice">In <code>app.js</code>, inside <code>CONFIG</code>, paste your Supabase <b>Project URL</b> and <b>Publishable key</b>.</div></div>
</section>

<!-- ============ Welcome / sign up ============ -->
<section id="screen-name" class="screen" hidden>
  <div class="wrap" style="max-width:520px">
    <div class="welcome-hero">
      <img src="icons/icon-192.png" alt="">
      <h1>Talk Together</h1>
      <p class="muted" data-i18n="appTagline"></p>
    </div>
    <form id="name-form" class="card">
      <button type="button" class="avatar-pick" id="name-photo-btn">
        <div class="av" id="name-photo-preview">📷</div>
        <span data-i18n="choosePhoto"></span>
      </button>
      <label class="lbl" for="name-input" data-i18n="yourName"></label>
      <input id="name-input" maxlength="30" autocomplete="nickname" data-i18n-ph="namePh" required>
      <label class="check">
        <input type="checkbox" id="age-check">
        <span><span data-i18n="ageConfirm"></span> <a href="privacy.html" target="_blank" rel="noopener" data-i18n="termsLink"></a></span>
      </label>
      <button class="btn block" type="submit" data-i18n="start"></button>
    </form>
  </div>
</section>

<!-- ============ Main (tabs) ============ -->
<section id="screen-main" class="screen" hidden>
  <header class="topbar">
    <div class="brand"><img src="icons/icon-192.png" alt=""><span>Talk Together</span></div>
    <div class="top-right">
      <button class="icon-btn" id="top-chat" type="button" aria-label="messages" style="position:relative">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="badge-dot" id="top-chat-badge" hidden>0</span>
      </button>
      <span class="pill" id="top-streak" title="streak">🔥 0</span>
      <button class="icon-btn" id="top-me" type="button" aria-label="me" style="padding:0;overflow:hidden"></button>
    </div>
  </header>
  <div class="wrap">
    <div id="tab-rooms" class="tab"></div>
    <div id="tab-feed" class="tab" hidden></div>
    <div id="tab-partners" class="tab" hidden></div>
    <div id="tab-ranking" class="tab" hidden></div>
    <div id="tab-me" class="tab" hidden></div>
  </div>
  <button class="btn fab" id="new-room-btn" type="button">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    <span data-i18n="newRoom"></span>
  </button>
  <button class="btn fab" id="new-post-btn" type="button" hidden>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    <span data-i18n="newPost"></span>
  </button>
  <nav class="tabbar" id="tabbar">
    <button type="button" data-tab="feed" class="on">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      <span data-i18n="tabFeed"></span></button>
    <button type="button" data-tab="rooms">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
      <span data-i18n="tabRooms"></span></button>
    <button type="button" data-tab="partners">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span data-i18n="tabPartners"></span></button>
    <button type="button" data-tab="ranking">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>
      <span data-i18n="tabRanking"></span></button>
    <button type="button" data-tab="me" style="position:relative">
      <span class="badge-dot" id="me-badge" hidden style="inset-inline-end:calc(50% - 22px);top:6px">0</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      <span data-i18n="tabMe"></span></button>
  </nav>
</section>

<!-- ============ Create room ============ -->
<section id="screen-create" class="screen" hidden>
  <header class="appbar">
    <button class="icon-btn" type="button" data-back="main" aria-label="back"><svg class="flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="title" data-i18n="createTitle"></div>
  </header>
  <div class="wrap" style="padding-bottom:40px">
    <form id="create-form" class="card">
      <label class="lbl" for="room-title" data-i18n="roomTitle"></label>
      <input id="room-title" maxlength="80" dir="auto" data-i18n-ph="roomTitlePh" required>
      <label class="lbl" for="room-lang" data-i18n="language"></label>
      <select id="room-lang" required></select>
      <label class="lbl" for="room-level" data-i18n="level"></label>
      <select id="room-level" required></select>
      <label class="lbl" data-i18n="roomType"></label>
      <div class="seg" id="room-type">
        <button type="button" class="chip on" data-v="public" data-i18n="publicRoom"></button>
        <button type="button" class="chip" data-v="private" data-i18n="privateRoom"></button>
      </div>
      <label class="lbl" data-i18n="when"></label>
      <div class="seg" id="room-when">
        <button type="button" class="chip on" data-v="now" data-i18n="now"></button>
        <button type="button" class="chip" data-v="later" data-i18n="later"></button>
      </div>
      <div id="room-time-box" hidden>
        <label class="lbl" for="room-time" data-i18n="startTime"></label>
        <input id="room-time" type="datetime-local">
      </div>
      <label class="lbl" for="room-max" data-i18n="maxPeople"></label>
      <select id="room-max"><option>5</option><option>10</option><option selected>20</option><option>50</option><option>100</option></select>
      <div style="height:18px"></div>
      <button class="btn block" type="submit" id="create-submit" data-i18n="createJoin"></button>
    </form>
  </div>
</section>

<!-- ============ Edit profile ============ -->
<section id="screen-edit" class="screen" hidden>
  <header class="appbar">
    <button class="icon-btn" type="button" data-back="main" aria-label="back"><svg class="flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="title" data-i18n="editProfile"></div>
  </header>
  <div class="wrap" style="padding-bottom:40px">
    <form id="edit-form" class="card">
      <button type="button" class="avatar-pick" id="edit-photo-btn">
        <div class="av" id="edit-photo-preview">📷</div>
        <span data-i18n="choosePhoto"></span>
      </button>
      <label class="lbl" for="edit-name" data-i18n="yourName"></label>
      <input id="edit-name" maxlength="30" dir="auto" required>
      <label class="lbl" for="edit-country" data-i18n="country"></label>
      <select id="edit-country"></select>
      <label class="lbl" for="edit-native" data-i18n="nativeLang"></label>
      <select id="edit-native"></select>
      <label class="lbl" data-i18n="learningLangs"></label>
      <div id="edit-learning"></div>
      <button type="button" class="btn ghost sm" id="edit-add-lang" data-i18n="addLanguage"></button>
      <label class="lbl" for="edit-bio" data-i18n="bio"></label>
      <textarea id="edit-bio" maxlength="200" dir="auto" data-i18n-ph="bioPh"></textarea>
      <div style="height:18px"></div>
      <button class="btn block" type="submit" data-i18n="save"></button>
    </form>
  </div>
</section>

<!-- ============ Saved words ============ -->
<section id="screen-saved" class="screen" hidden>
  <header class="appbar">
    <button class="icon-btn" type="button" data-back="main" aria-label="back"><svg class="flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="title" data-i18n="savedWords"></div>
  </header>
  <div class="wrap" style="padding-bottom:40px"><div id="saved-list"></div></div>
</section>

<!-- ============ Settings ============ -->
<section id="screen-settings" class="screen" hidden>
  <header class="appbar">
    <button class="icon-btn" type="button" data-back="main" aria-label="back"><svg class="flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="title" data-i18n="settings"></div>
  </header>
  <div class="wrap" style="padding-bottom:40px"><div id="settings-body"></div></div>
</section>

<!-- ============ New post ============ -->
<section id="screen-compose" class="screen" hidden>
  <header class="appbar">
    <button class="icon-btn" type="button" data-back="main" aria-label="back"><svg class="flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="title" data-i18n="createPostTitle"></div>
  </header>
  <div class="wrap" style="padding-bottom:40px">
    <form id="compose-form" class="card">
      <textarea id="compose-text" maxlength="500" dir="auto" rows="5" data-i18n-ph="postPh"></textarea>
      <div class="muted small" style="text-align:end" id="compose-count">0 / 500</div>
      <div id="compose-preview" hidden style="position:relative;margin-top:10px">
        <img id="compose-img" alt="" style="width:100%;border-radius:16px;max-height:420px;object-fit:cover">
        <button type="button" class="icon-btn" id="compose-remove" style="position:absolute;top:8px;inset-inline-end:8px" aria-label="remove">✕</button>
      </div>
      <div class="row" style="margin-top:12px">
        <button type="button" class="btn ghost" id="compose-photo">📷 <span data-i18n="addImage"></span></button>
        <button type="submit" class="btn" id="compose-submit" data-i18n="publish"></button>
      </div>
    </form>
  </div>
</section>

<!-- ============ Followers / following page ============ -->
<section id="screen-follows" class="screen" hidden>
  <header class="appbar">
    <button class="icon-btn" type="button" id="fw-back" aria-label="back"><svg class="flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="title" id="fw-title" dir="auto"></div>
  </header>
  <div class="wrap" style="padding-bottom:40px">
    <div class="seg-tabs" id="fw-seg">
      <button type="button" data-k="following"></button>
      <button type="button" data-k="followers"></button>
      <button type="button" data-k="friends"></button>
    </div>
    <div id="fw-list"></div>
  </div>
</section>

<!-- ============ Someone's profile ============ -->
<section id="screen-profile" class="screen" hidden>
  <header class="appbar">
    <button class="icon-btn" type="button" id="pf-back" aria-label="back"><svg class="flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="title" id="pf-title" dir="auto"></div>
    <button class="icon-btn" type="button" id="pf-more" aria-label="more"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </header>
  <div class="wrap" style="padding-bottom:40px"><div id="pf-body"></div></div>
</section>

<!-- ============ Inbox (private messages) ============ -->
<section id="screen-inbox" class="screen" hidden>
  <header class="appbar">
    <button class="icon-btn" type="button" data-back="main" aria-label="back"><svg class="flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="title" data-i18n="messagesTitle"></div>
  </header>
  <div class="wrap" style="padding-bottom:40px"><div id="inbox-list"></div></div>
</section>

<!-- ============ Private chat ============ -->
<section id="screen-dm" class="screen dm-screen" hidden>
  <header class="appbar">
    <button class="icon-btn" type="button" id="dm-back" aria-label="back"><svg class="flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <button type="button" class="dm-who" id="dm-who"></button>
  </header>
  <div class="dm-body" id="dm-body"><div id="dm-list"></div></div>
  <div class="dm-bottom">
    <div class="notice small" id="dm-locked" hidden></div>
    <form class="dm-form" id="dm-form">
      <input id="dm-input" maxlength="1000" autocomplete="off" dir="auto" data-i18n-ph="chatPh">
      <button class="dm-rec" id="dm-rec" type="button" aria-label="voice">🎤</button>
      <button class="dm-send" type="submit" aria-label="send"><svg class="flip" viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6l.1 6.5L15 12 3.5 13.9z"/></svg></button>
    </form>
  </div>
</section>

<!-- ============ Voice room ============ -->
<section id="screen-room" class="screen stage-screen" hidden>
  <header class="stage-head">
    <button class="s-btn" type="button" id="room-back" aria-label="leave"><svg class="flip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="s-title">
      <div class="t" id="room-title-view" dir="auto"></div>
      <div class="s-sub" id="room-tags"></div>
    </div>
    <button class="s-follow" type="button" id="room-follow" hidden></button>
    <button class="s-btn" type="button" id="room-share" aria-label="share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg></button>
    <button class="s-btn" type="button" id="room-more" aria-label="more"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </header>
  <div class="stage-body">
    <button class="btn block" id="audio-unlock" type="button" hidden data-i18n="tapAudio" style="margin-bottom:12px"></button>
    <div class="seats" id="seats"></div>
    <div class="aud-head"><span id="room-status"></span></div>
    <div class="audience" id="audience"></div>
    <div id="topic-box"></div>
    <div class="s-chat" id="chat-list"></div>
  </div>
  <div class="s-bottom">
    <div class="reply-bar" id="reply-bar" hidden><span id="reply-text" dir="auto"></span><button type="button" id="reply-cancel" aria-label="cancel">✕</button></div>
    <form class="s-form" id="chat-form">
      <input id="chat-input" maxlength="300" autocomplete="off" dir="auto" data-i18n-ph="chatPh">
      <button class="s-round" id="topic-btn" type="button" hidden title="topic">🃏</button>
      <button class="s-round" id="hand-btn" type="button" hidden title="hand">✋</button>
      <button class="s-round" id="stage-down-btn" type="button" hidden title="leave stage">⬇️</button>
      <button class="s-round" id="mic-btn" type="button" disabled title="mic">🎙️</button>
      <button class="s-round send" type="submit" aria-label="send"><svg class="flip" viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6l.1 6.5L15 12 3.5 13.9z"/></svg></button>
    </form>
  </div>
</section>

<div id="sheet-backdrop" hidden></div>
<div id="sheet" class="sheet" hidden role="dialog"><div class="sheet-handle"></div><div id="sheet-body"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="audio-sink" hidden></div>
<input type="file" id="photo-input" accept="image/*" hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.22.4/dist/livekit-client.umd.js"></script>
<script src="i18n.js"></script>
<script src="topics.js"></script>
<script src="app.js"></script>
</body>
</html>
