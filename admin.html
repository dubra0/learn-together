<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn Together — Admin</title>
<meta name="theme-color" content="#6d4aff">
<meta name="robots" content="noindex">
<link rel="icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5fb;--card:#fff;--ink:#17142b;--muted:#6e6888;--line:#ebe8f5;--brand:#6d4aff;--soft:#efeaff;--danger:#ef4444;--ok:#16a34a}
@media (prefers-color-scheme: dark){:root{--bg:#0f0d1a;--card:#1a1729;--ink:#f3f1ff;--muted:#a49fbe;--line:#2a2541;--brand:#8b72ff;--soft:#262043}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Arabic",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 60px}
h1{margin:0 0 4px} .muted{color:var(--muted)}
.tabs{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
.tabs button,.btn{border:0;border-radius:12px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer;background:var(--soft);color:var(--brand)}
.tabs button.on{background:var(--brand);color:#fff}
.btn.danger{background:var(--danger);color:#fff} .btn.ok{background:var(--ok);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tag{background:var(--soft);color:var(--brand);border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700}
.empty{text-align:center;padding:30px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:6px 0 14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.tile .v{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
.tile .l{font-size:.82rem;color:var(--muted);font-weight:600}
.tile .s{font-size:.75rem;color:var(--muted)}
.tile.live .v::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#ef4444;margin-inline-end:6px;vertical-align:middle}
.chart-card h3{margin:0 0 2px;font-size:1rem}
.chart-card .sub{font-size:.8rem;color:var(--muted);margin-bottom:8px}
.chart{position:relative;direction:ltr}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .axis text{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .bar{fill:var(--brand)}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover + .bar,.chart .bar.hl{opacity:.75}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.8rem;border-radius:10px;padding:6px 10px;white-space:nowrap;
  transform:translate(-50%,-110%);box-shadow:0 6px 18px rgba(0,0,0,.25);direction:rtl}
details.tbl{margin-top:8px;font-size:.85rem}
details.tbl table{border-collapse:collapse;width:100%;margin-top:6px}
details.tbl td,details.tbl th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:start;font-variant-numeric:tabular-nums}
/* 💡 free plans */
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.plan{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;gap:6px;border-inline-start:5px solid var(--st,#16a34a)}
.plan h3{margin:0;font-size:.98rem;display:flex;justify-content:space-between;gap:6px;align-items:center}
.plan .who{font-size:.72rem;color:var(--muted);font-weight:700}
.plan .num{font-size:1.25rem;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.plan .num small{font-size:.8rem;color:var(--muted);font-weight:600}
.meter{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;background:var(--st,#16a34a);min-width:4px}
.plan .left{font-size:.8rem;font-weight:700;color:var(--st,#16a34a)}
.plan .note{font-size:.76rem;color:var(--muted);line-height:1.6}
.plan .acts{display:flex;gap:6px;flex-wrap:wrap}
.plan .acts a,.plan .acts button{font:inherit;font-size:.76rem;font-weight:700;border:0;border-radius:10px;padding:4px 10px;background:var(--soft);color:var(--brand);cursor:pointer;text-decoration:none}
.pill{font-size:.68rem;font-weight:800;border-radius:999px;padding:1px 8px;white-space:nowrap}
.pill.ok{background:#dcfce7;color:#166534}.pill.warn{background:#fef3c7;color:#92400e}.pill.bad{background:#ffe4e6;color:#9f1239}.pill.man{background:var(--soft);color:var(--muted)}
.alert{border-radius:14px;padding:10px 14px;margin:0 0 10px;font-weight:700;font-size:.88rem;background:#ffe4e6;color:#9f1239;border:1px solid #fecdd3}
.alert.warn{background:#fef3c7;color:#92400e;border-color:#fde68a}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ef4444;margin-inline-start:6px;vertical-align:middle}
</style>
</head>
<body>
<div class="wrap">
  <h1>🛡️ پانێڵی بەڕێوەبەر</h1>
  <div class="muted">Learn Together — ڕاپۆرت، بلۆکی هەمیشەیی، داخستنی ژوور</div>
  <div class="tabs">
    <button class="on" data-t="stats">📊 ئامار</button>
    <button data-t="open">🚩 ڕاپۆرتە کراوەکان</button>
    <button data-t="resolved">✅ چارەسەرکراو</button>
    <button data-t="banned">⛔ بلۆککراوەکان</button>
    <button data-t="rooms">🎙️ ژوورە کراوەکان</button>
    <button data-t="plans" id="tabPlans">💡 پلانە بەخۆڕاییەکان</button>
  </div>
  <div id="planAlert"></div>
  <div id="box"><div class="empty">…</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://vjuqtzhefxpiqsmasfkb.supabase.co";
const SUPABASE_KEY = "sb_publishable_hs16UKvg16dApnabYQM9Cw_l2S-_XAU";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const REASONS = { spam: "سپام", harassment: "هەراسان", inappropriate: "ناوەڕۆکی نەشیاو", underage: "کەمتر لە ١٣ ساڵ", other: "تر" };
let tab = "stats";
const nf = (n) => new Intl.NumberFormat("en").format(n || 0);

/* one series per chart: a single colour, the title names it, hover shows the exact value */
function barChart(rows, key, label) {
  const W = 640, H = 200, P = { l: 34, r: 8, t: 10, b: 26 };
  const max = Math.max(1, ...rows.map((r) => r[key]));
  const step = Math.max(1, Math.ceil(max / 4));
  const top = step * 4;
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const bw = iw / rows.length, gap = 2;
  const y = (v) => P.t + ih - (v / top) * ih;
  const grid = [0, 1, 2, 3, 4].map((i) => `<line x1="${P.l}" x2="${W - P.r}" y1="${y(i * step)}" y2="${y(i * step)}"/>`).join("");
  const yl = [0, 2, 4].map((i) => `<text x="${P.l - 6}" y="${y(i * step) + 4}" text-anchor="end">${i * step}</text>`).join("");
  const xl = rows.map((r, i) => (i % 3 === 0 || i === rows.length - 1)
    ? `<text x="${P.l + i * bw + bw / 2}" y="${H - 8}" text-anchor="middle">${r.d.slice(5)}</text>` : "").join("");
  const bars = rows.map((r, i) => {
    const x = P.l + i * bw + gap / 2, h = Math.max(r[key] ? 2 : 0, P.t + ih - y(r[key])), w = bw - gap;
    const rad = Math.min(4, w / 2, h);
    // rounded top only, flat on the baseline
    const d = h <= 0 ? "" : `M${x},${P.t + ih} V${P.t + ih - h + rad} Q${x},${P.t + ih - h} ${x + rad},${P.t + ih - h} H${x + w - rad} Q${x + w},${P.t + ih - h} ${x + w},${P.t + ih - h + rad} V${P.t + ih} Z`;
    return `<rect class="hit" x="${P.l + i * bw}" y="${P.t}" width="${bw}" height="${ih}" data-i="${i}"/><path class="bar" d="${d}" data-i="${i}"/>`;
  }).join("");
  const id = "c" + Math.random().toString(36).slice(2);
  setTimeout(() => {
    const host = document.getElementById(id); if (!host) return;
    const tip = host.querySelector(".tip");
    host.querySelectorAll(".hit").forEach((h) => {
      h.addEventListener("mousemove", (e) => {
        const r = rows[Number(h.dataset.i)], box = host.getBoundingClientRect();
        tip.hidden = false; tip.textContent = `${r.d} · ${label}: ${nf(r[key])}`;
        tip.style.left = `${e.clientX - box.left}px`; tip.style.top = `${e.clientY - box.top}px`;
        host.querySelectorAll(".bar").forEach((b) => b.classList.toggle("hl", b.dataset.i === h.dataset.i));
      });
      h.addEventListener("mouseleave", () => { tip.hidden = true; host.querySelectorAll(".bar").forEach((b) => b.classList.remove("hl")); });
    });
  });
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
      <g class="grid">${grid}</g><g class="axis">${yl}${xl}</g>${bars}</svg><div class="tip" hidden></div></div>
    <details class="tbl"><summary>خشتە</summary><table><tr><th>ڕۆژ</th><th>${esc(label)}</th></tr>
      ${rows.map((r) => `<tr><td>${r.d}</td><td>${nf(r[key])}</td></tr>`).join("")}</table></details>`;
}
async function loadStats(box) {
  const { data: s, error } = await sb.rpc("admin_stats");
  if (error) { box.innerHTML = `<div class="card">⚠️ ${esc(error.message)}<br><span class="muted">SQL ـی update-10 Run بکە.</span></div>`; return; }
  const tile = (v, l, sub, cls = "") => `<div class="tile ${cls}"><div class="v">${nf(v)}</div><div class="l">${l}</div>${sub ? `<div class="s">${sub}</div>` : ""}</div>`;
  box.innerHTML = `
    <div class="tiles">
      ${tile(s.users, "👥 بەکارهێنەر", `+${nf(s.users_today)} ئەمڕۆ · +${nf(s.users_7d)} لە ٧ ڕۆژدا`)}
      ${tile(s.active_7d, "🔥 چالاک لە ٧ ڕۆژدا", "ڕاهێنانیان کردووە")}
      ${tile(s.live_now, "🔴 Live ـی ئێستا", `📹 ${nf(s.camera_live_now)} کامێرا`, "live")}
      ${tile(s.rooms, "🎙️ ژوور", `+${nf(s.rooms_7d)} لە ٧ ڕۆژدا`)}
      ${tile(s.posts, "📝 پۆست", `+${nf(s.posts_7d)} لە ٧ ڕۆژدا`)}
      ${tile(s.videos, "🎥 ڤیدیۆ", "")}
      ${tile(s.views, "👁 بینین", "")}
      ${tile(s.likes, "❤️ لایک", "")}
      ${tile(s.comments, "💬 کۆمێنت", "")}
      ${tile(s.follows, "🤝 فۆڵۆو", "")}
      ${tile(s.messages, "✉️ نامەی تایبەت", "")}
      ${tile(s.battles, "⚔️ شەڕ", "")}
      ${tile(s.reports_open, "🚩 ڕاپۆرتی کراوە", "")}
      ${tile(s.banned, "⛔ بلۆککراو", "")}
    </div>
    <div class="card chart-card"><h3>👥 بەکارهێنەری نوێ</h3><div class="sub">هەر ڕۆژێک، ١٤ ڕۆژی ڕابردوو</div>${barChart(s.daily || [], "users", "بەکارهێنەری نوێ")}</div>
    <div class="card chart-card"><h3>📝 پۆستی نوێ</h3><div class="sub">هەر ڕۆژێک، ١٤ ڕۆژی ڕابردوو</div>${barChart(s.daily || [], "posts", "پۆستی نوێ")}</div>
    <div class="card chart-card"><h3>🎙️ ژوور و Live ی نوێ</h3><div class="sub">هەر ڕۆژێک، ١٤ ڕۆژی ڕابردوو</div>${barChart(s.daily || [], "rooms", "ژووری نوێ")}</div>`;
}

/* ---------- 💡 free plans: how much is used, how much is left, and a warning before anything runs out (update-48) ---------- */
const SUPA_USAGE = "https://supabase.com/dashboard/org/_/usage";
// measured: the database counts these itself · lim = the key in plan_limits
const MEASURED = [
  { key: "db_mb", name: "🗄️ داتابەیس", who: "Supabase", unit: "MB", per: "", up: "Supabase Pro ≈ $25/مانگ (8 GB)", link: SUPA_USAGE },
  { key: "storage_mb", name: "🖼️ فایل و وێنە (Storage)", who: "Supabase", unit: "MB", per: "", up: "Supabase Pro ≈ $25/مانگ (100 GB)", link: SUPA_USAGE },
  { key: "mau", name: "👥 بەکارهێنەری مانگانە", who: "Supabase", unit: "", per: "لەم مانگەدا", up: "Supabase Pro ≈ $25/مانگ (100,000)", link: SUPA_USAGE },
  { key: "emails_day", name: "✉️ ئیمەیڵی کۆد", who: "Gmail", unit: "", per: "ئەمڕۆ (نزیکەیی)", up: "Gmail بگۆڕە بە Resend یان Brevo (بەخۆڕایی تا ٣٠٠/ڕۆژ، پاشان پارەدار)", link: "https://supabase.com/dashboard/project/vjuqtzhefxpiqsmasfkb/auth/smtp" },
  { key: "voice_min_month", name: "🎙️ خولەکی دەنگ", who: "LiveKit", unit: "min", per: "لەم مانگەدا", up: "LiveKit Ship ≈ $50/مانگ", link: "https://cloud.livekit.io/" },
];
// checked by hand on the provider's page (the database can't see these)
const MANUAL = [
  { name: "📶 داتای ناردن (Egress)", who: "Supabase", limit: "5 GB لە مانگێکدا", note: "وێنە و ڤیدیۆ و داتای ئەپ کە دەنێردرێن بۆ مۆبایلەکان.", link: SUPA_USAGE },
  { name: "⚡ Realtime", who: "Supabase", limit: "200 پەیوەندی لە یەک کاتدا · 2M نامە/مانگ", note: "چات، پشتگیری و ژوورەکان بە لایڤ.", link: SUPA_USAGE },
  { name: "🧩 Edge Functions", who: "Supabase", limit: "500,000 بانگکردن/مانگ", note: "smooth-worker (تۆکنی دەنگ) و clever-service (کڕینی Apple).", link: SUPA_USAGE },
  { name: "💤 داخرانی پرۆژە", who: "Supabase", limit: "پاش ٧ ڕۆژ بێ چالاکی", note: "لە پلانی بەخۆڕاییدا ئەگەر هەفتەیەک کەس بەکاری نەهێنێت، پرۆژەکە دەوەستێت. لە Pro دا ناوەستێت.", link: "https://supabase.com/dashboard/project/vjuqtzhefxpiqsmasfkb" },
  { name: "🍏 بیلدی iPhone", who: "Codemagic", limit: "500 خولەک/مانگ", note: "هەر بیلدێک نزیکەی ١٠–٢٠ خولەکە.", link: "https://codemagic.io/apps" },
  { name: "💰 کڕینی Apple", who: "RevenueCat", limit: "بەخۆڕایی تا $2,500 داهات/مانگ", note: "پاش ئەوە ١٪ ی داهاتەکە وەردەگرێت.", link: "https://app.revenuecat.com/" },
  { name: "🌐 ماڵپەڕ", who: "GitHub Pages", limit: "نزیکەی 100 GB/مانگ", note: "ڤیدیۆی دیارییەکان زۆرترین بەشن.", link: "https://github.com/dubra0/learn-together" },
  { name: "🍎 ئەندامێتی Apple", who: "Apple", limit: "$99 ساڵانە", note: "ئەگەر نوێ نەکرێتەوە، ئەپەکە لە App Store لادەبرێت.", link: "https://developer.apple.com/account" },
];
const lvl = (p) => (p >= 90 ? "bad" : p >= 70 ? "warn" : "ok");
const COL = { ok: "#16a34a", warn: "#d97706", bad: "#e11d48" };
async function getUsage() { const { data, error } = await sb.rpc("admin_usage"); if (error) throw error; return data; }
function nearLimits(u) {
  return MEASURED.map((m) => ({ m, used: Number(u[m.key] || 0), lim: Number(u.limits?.[m.key] || 0) }))
    .filter((x) => x.lim > 0).map((x) => ({ ...x, p: (x.used / x.lim) * 100 })).filter((x) => x.p >= 70);
}
function showAlert(u) {
  const near = nearLimits(u), bad = near.some((x) => x.p >= 90);
  $("#planAlert").innerHTML = near.length ? `<div class="alert ${bad ? "" : "warn"}">${bad ? "🚨" : "⚠️"} ئاگاداربە: ${near.map((x) => `${esc(x.m.name)} ${Math.round(x.p)}٪`).join(" · ")} — سەیری «💡 پلانە بەخۆڕاییەکان» بکە.</div>` : "";
  $("#tabPlans").innerHTML = "💡 پلانە بەخۆڕاییەکان" + (near.length ? `<span class="dot"></span>` : "");
}
// when a number goes back to 0: monthly ones on the 1st of next month, emails every day, sizes never (they are totals)
function resetText(key, u) {
  const ms = new Date(u.month_start + "T00:00:00Z"), next = new Date(Date.UTC(ms.getUTCFullYear(), ms.getUTCMonth() + 1, 1));
  const nextTxt = next.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  const days = Math.max(0, Math.ceil((next - Date.now()) / 86400000));
  if (key === "mau" || key === "voice_min_month") return `🔄 دەبێتەوە بە سفر: ${nextTxt} (${days} ڕۆژی ماوە)`;
  if (key === "emails_day") return "🔄 هەموو ڕۆژێک لە کاتژمێر 00:00 (UTC) دەبێتەوە بە سفر";
  return "📦 ئەمە قەبارەی ئێستایە و سفر نابێتەوە. تەنها کاتێک شت دەسڕیتەوە کەم دەبێتەوە.";
}
async function loadPlans(box) {
  let u;
  try { u = await getUsage(); } catch (e) { box.innerHTML = `<div class="card">⚠️ ${esc(e.message)}<br><span class="muted">SQL ـی update-48 Run بکە.</span></div>`; return; }
  showAlert(u);
  const card = (m) => {
    const used = Number(u[m.key] || 0), lim = Number(u.limits?.[m.key] || 0), p = lim ? Math.min(100, (used / lim) * 100) : 0, l = lvl(p);
    const left = Math.max(0, lim - used);
    const extra = m.key === "voice_min_month" ? `<div class="note">ئەمڕۆ: ${nf(u.voice_min_today)} خولەک${u.voice_since ? ` · لە ${esc(u.voice_since)} ەوە دەژمێردرێت` : " · لە ئێستاوە دەژمێردرێت"}. ژمارەی ڕاستەقینە لە LiveKit ببینە.</div>`
      : m.key === "emails_day" ? `<div class="note">ئیمەیڵەکانی کۆدی چوونەژوورەوە. Gmail ڕۆژانە نزیکەی ٥٠٠ ڕێگە دەدات.</div>` : "";
    return `<div class="plan" style="--st:${COL[l]}"><h3>${esc(m.name)} <span class="pill ${l}">${l === "ok" ? "✅ باشە" : l === "warn" ? "⚠️ نزیکە" : "🚨 تەواو دەبێت"}</span></h3>
      <div class="who">${esc(m.who)} ${m.per ? "· " + esc(m.per) : ""}</div>
      <div class="num">${nf(used)} <small>/ ${nf(lim)} ${esc(m.unit)}</small></div>
      <div class="meter" role="img" aria-label="${Math.round(p)}%"><i style="width:${p.toFixed(1)}%"></i></div>
      <div class="left">${Math.round(p)}٪ بەکارهاتووە · ${nf(Math.round(left))} ${esc(m.unit)} ماوە</div>${extra}
      <div class="note">${resetText(m.key, u)}</div>
      <div class="note">⬆️ ${esc(m.up)}</div>
      <div class="acts"><a href="${m.link}" target="_blank" rel="noopener">↗ بینین</a><button type="button" data-lim="${m.key}">✏️ گۆڕینی سنوور</button></div></div>`;
  };
  const man = (m) => `<div class="plan" style="--st:#94a3b8"><h3>${esc(m.name)} <span class="pill man">👁 بە دەست</span></h3>
      <div class="who">${esc(m.who)}</div><div class="num" style="font-size:1rem;text-align:start;direction:rtl">${esc(m.limit)}</div>
      <div class="note">${esc(m.note)}</div><div class="acts"><a href="${m.link}" target="_blank" rel="noopener">↗ بپشکنە</a></div></div>`;
  box.innerHTML = `<div class="card muted" style="font-size:.85rem">🟢 کەمتر لە ٧٠٪ · 🟠 ٧٠–٩٠٪ · 🔴 زیاتر لە ٩٠٪. کاتێک یەکێکیان سوور بوو، کاتی ئەوەیە بیگۆڕیت بۆ Pro.
      <br>نوێکرایەوە: ${esc(new Date(u.checked_at).toLocaleString("en-GB"))}</div>
    <h3 style="margin:14px 0 6px">📏 خۆی دەیژمێرێت</h3><div class="plans">${MEASURED.map(card).join("")}</div>
    <div class="card chart-card" style="margin-top:12px"><h3>🎙️ خولەکی دەنگ</h3><div class="sub">هەر ڕۆژێک، ١٤ ڕۆژی ڕابردوو</div>${barChart(u.voice_daily || [], "voice", "خولەکی دەنگ")}</div>
    <h3 style="margin:16px 0 6px">👁 بە دەست بیپشکنە (داتابەیس ناتوانێت بیبینێت)</h3><div class="plans">${MANUAL.map(man).join("")}</div>`;
  box.querySelectorAll("[data-lim]").forEach((b) => b.addEventListener("click", async () => {
    const k = b.dataset.lim, cur = u.limits?.[k];
    const v = prompt("سنووری نوێ بنووسە (تەنها ژمارە):", cur ?? "");
    if (v == null) return;
    const n = Number(String(v).replace(/[^\d.]/g, ""));
    if (!n) return alert("ژمارەیەکی دروست بنووسە.");
    const { error } = await sb.rpc("admin_set_limit", { p_key: k, p_lim: n });
    if (error) return alert(error.message);
    loadPlans(box);
  }));
}

document.querySelector(".tabs").addEventListener("click", (e) => {
  const b = e.target.closest("[data-t]"); if (!b) return;
  tab = b.dataset.t;
  document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === b));
  load();
});

async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $("#box").innerHTML = `<div class="empty">سەرەتا ئەپەکە لەم وێبگەڕەدا بکەرەوە و بچۆ ژوورەوە.</div>`; return; }
  const { data: isAdmin } = await sb.rpc("is_admin");
  if (!isAdmin) {
    $("#box").innerHTML = `<div class="card">⛔ تۆ بەڕێوەبەر نیت.<br><span class="muted">ID ـەکەت: <code>${esc(session.user.id)}</code></span></div>`;
    return;
  }
  load();
  getUsage().then(showAlert, () => {});   // ⚠️ a warning at the top if a free plan is close to its limit
}

async function names(ids) {
  const list = [...new Set(ids.filter(Boolean))];
  if (!list.length) return {};
  const { data } = await sb.from("profiles").select("id,name,banned").in("id", list);
  return Object.fromEntries((data || []).map((p) => [p.id, p]));
}

async function load() {
  const box = $("#box");
  box.innerHTML = `<div class="empty">…</div>`;
  if (tab === "stats") return loadStats(box);
  if (tab === "plans") return loadPlans(box);
  if (tab === "open" || tab === "resolved") {
    const { data, error } = await sb.from("reports").select("*").eq("status", tab).order("created_at", { ascending: false }).limit(100);
    if (error) { box.innerHTML = `<div class="card">${esc(error.message)}</div>`; return; }
    const ppl = await names((data || []).flatMap((r) => [r.reporter, r.reported_user]));
    const postIds = (data || []).map((r) => r.post_id).filter(Boolean);
    const posts = {};
    if (postIds.length) { const pr = await sb.from("posts").select("id,body,image_url").in("id", postIds); (pr.data || []).forEach((p) => (posts[p.id] = p)); }
    box.innerHTML = (data || []).map((r) => {
      const who = ppl[r.reported_user];
      return `<div class="card">
        <div><span class="tag">${esc(REASONS[r.reason] || r.reason)}</span> <span class="muted">${new Date(r.created_at).toLocaleString()}</span></div>
        <div style="margin-top:6px">👤 ڕاپۆرت لەسەر: <b>${esc(who?.name || (r.reported_user ? r.reported_user.slice(0, 8) : "—"))}</b> ${who?.banned ? "⛔" : ""}</div>
        ${r.room_id ? `<div>🎙️ ژوور: <code>${esc(r.room_id.slice(0, 8))}</code></div>` : ""}
        <div class="muted">ڕاپۆرتدەر: ${esc(ppl[r.reporter]?.name || "—")}</div>
        ${r.details ? `<div style="margin-top:6px">💬 ${esc(r.details)}</div>` : ""}
        ${r.post_id ? (posts[r.post_id]
          ? `<div class="card" style="margin:8px 0;background:var(--soft)">📝 <span dir="auto">${esc(posts[r.post_id].body || "")}</span>
              ${posts[r.post_id].image_url ? `<br><img src="${esc(posts[r.post_id].image_url)}" alt="" style="max-width:220px;border-radius:12px;margin-top:6px">` : ""}
              <div class="row"><button class="btn danger" data-delpost="${r.post_id}">🗑️ سڕینەوەی پۆست</button></div></div>`
          : `<div class="muted">📝 پۆستەکە سڕاوەتەوە</div>`) : ""}
        <div class="row">
          ${r.reported_user ? (who?.banned
            ? `<button class="btn" data-unban="${esc(r.reported_user)}">لابردنی بلۆک</button>`
            : `<button class="btn danger" data-ban="${esc(r.reported_user)}">⛔ بلۆکی هەمیشەیی</button>`) : ""}
          ${r.room_id ? `<button class="btn" data-close="${esc(r.room_id)}">داخستنی ژوور</button>` : ""}
          ${tab === "open" ? `<button class="btn ok" data-resolve="${r.id}">✅ چارەسەر کرا</button>` : ""}
        </div></div>`;
    }).join("") || `<div class="empty">هیچ ڕاپۆرتێک نییە 🎉</div>`;
  }
  if (tab === "banned") {
    const { data } = await sb.from("profiles").select("id,name,created_at").eq("banned", true).limit(200);
    box.innerHTML = (data || []).map((p) => `<div class="card"><b>${esc(p.name)}</b> <span class="muted">${esc(p.id.slice(0, 8))}</span>
      <div class="row"><button class="btn" data-unban="${esc(p.id)}">لابردنی بلۆک</button></div></div>`).join("") || `<div class="empty">کەس بلۆک نەکراوە</div>`;
  }
  if (tab === "rooms") {
    const { data } = await sb.from("rooms").select("*").eq("is_live", true).order("created_at", { ascending: false }).limit(100);
    box.innerHTML = (data || []).map((r) => `<div class="card"><b dir="auto">${esc(r.title)}</b> ${r.is_private ? "🔒" : ""}
      <div class="muted">👑 ${esc(r.host_name)} · ${esc(r.language)} · ${new Date(r.created_at).toLocaleString()}</div>
      <div class="row"><button class="btn" data-close="${esc(r.id)}">داخستنی ژوور</button><button class="btn danger" data-ban="${esc(r.host_id)}">⛔ بلۆکی خاوەن</button></div></div>`).join("")
      || `<div class="empty">هیچ ژوورێکی کراوە نییە</div>`;
  }
}

document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-ban],[data-unban],[data-close],[data-resolve],[data-delpost]");
  if (!b) return;
  let res;
  if (b.dataset.delpost) { if (!confirm("ئەم پۆستە بسڕدرێتەوە؟")) return; res = await sb.from("posts").delete().eq("id", Number(b.dataset.delpost)); }
  if (b.dataset.ban) { if (!confirm("ئەم بەکارهێنەرە بە هەمیشەیی بلۆک بکرێت؟ ژوورەکانیشی دادەخرێن.")) return; res = await sb.rpc("admin_set_ban", { p_user: b.dataset.ban, p_banned: true }); }
  if (b.dataset.unban) res = await sb.rpc("admin_set_ban", { p_user: b.dataset.unban, p_banned: false });
  if (b.dataset.close) res = await sb.rpc("admin_close_room", { p_room: b.dataset.close });
  if (b.dataset.resolve) res = await sb.from("reports").update({ status: "resolved" }).eq("id", Number(b.dataset.resolve));
  if (res?.error) alert(res.error.message);
  load();
});

start();
</script>
</body>
</html>
